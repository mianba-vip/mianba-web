# 新前端机的宿主机 Nginx；后端经 systemd SSH 隧道监听在本机 23333。
map $http_upgrade $mianba_connection_upgrade {
    default upgrade;
    '' close;
}
upstream mianba_backend {
    server 127.0.0.1:23333;
    keepalive 16;
}
server {
    listen 80;
    listen [::]:80;
    server_name mianba.vip www.mianba.vip;
    return 308 https://mianba.vip$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mianba.vip www.mianba.vip;
    ssl_certificate __DEPLOY_DIR__/certs/mianba.vip.pem;
    ssl_certificate_key __DEPLOY_DIR__/certs/mianba.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MIANBA_SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root __DEPLOY_DIR__/current;
    index index.html;
    client_max_body_size 50m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location /api/ {
        proxy_pass http://mianba_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mianba_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /actuator/health {
        proxy_pass http://mianba_backend/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
    location ~ /\. { deny all; }
    location = /app { return 301 /app/; }
    location /app/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location /download/ { try_files $uri =404; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
